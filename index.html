<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="IELTS Listening 与 Academic Reading 逐句音频学习平台">
  <title>IELTS Sentence Lab</title><link rel="stylesheet" href="mvp.css?v=1.1.3">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#library"><span class="brand-mark">IS</span><span><strong>IELTS</strong><small>Sentence Lab</small></span></a>
      <nav aria-label="主导航">
        <a href="#library" data-route="library">资料库</a>
        <a href="#study" data-route="study">逐句学习</a><a href="#vocabulary" data-route="vocabulary">生词本 <b id="vocabCount">0</b></a>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span>数据保存在当前浏览器</div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar"><button id="mobileMenu" class="icon-btn menu-btn" aria-label="打开菜单">☰</button><div><p class="eyebrow" id="pageEyebrow">YOUR LIBRARY</p><h1 id="pageTitle">资料库</h1></div><button class="quiet-btn" id="quickContinue">▶ 继续学习</button></header>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <dialog id="vocabDialog" aria-labelledby="vocabDialogTitle"><form method="dialog" id="vocabForm" class="modal-card">
    <div class="modal-head"><div><p class="eyebrow">VOCABULARY</p><h2 id="vocabDialogTitle">添加到生词本</h2></div><button value="cancel" class="icon-btn" aria-label="关闭">×</button></div>
    <label>Word / Phrase<input id="vocabText" required readonly></label>
    <label>English Definition<textarea id="vocabDefinition" rows="4" required placeholder="从 Longman 选择符合当前语境的英文释义，并手动粘贴到这里"></textarea></label>
    <div class="read-only"><span>Original Sentence</span><p id="vocabSentence"></p></div><div class="read-only"><span>Source</span><p id="vocabSource"></p></div>
    <button type="button" class="audio-preview" id="vocabAudio">🔊 播放 Original Sentence Audio</button>
    <div class="modal-actions"><button value="cancel" class="secondary-btn">取消</button><button type="button" id="saveVocab" class="primary-btn">保存</button></div>
  </form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="mvp.js?v=1.1.2" defer></script>
</body></html>
