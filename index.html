<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <script data-file-launch>
    if(location.protocol==='file:')location.replace(`http://localhost:8080/${location.search}${location.hash||'#library'}`);
  </script>
  <meta name="description" content="IELTS Listening 与 Academic Reading 逐句音频学习平台">
  <title>IELTS Sentence Lab</title><link rel="stylesheet" href="mvp.css?v=1.4.0">
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>
  <div class="shell">
    <aside class="sidebar" id="primarySidebar">
      <a class="brand" href="#library"><span class="brand-mark">IS</span><span><strong>IELTS</strong><small>Sentence Lab</small></span></a>
      <nav aria-label="主导航">
        <a href="#library" data-route="library">资料库</a>
        <a href="#study" data-route="study">逐句学习</a>
        <a href="#review" data-route="review">今日复习 <b id="reviewCount">0</b></a>
        <a href="#progress" data-route="progress">学习画像</a>
        <a href="#vocabulary" data-route="vocabulary">生词本 <b id="vocabCount">0</b></a>
      </nav>
      <div class="sidebar-note"><span class="status-dot"></span>数据保存在当前浏览器</div>
    </aside>
    <main id="main" tabindex="-1">
      <header class="topbar"><button id="mobileMenu" class="icon-btn menu-btn" type="button" aria-label="打开菜单" aria-controls="primarySidebar" aria-expanded="false"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div><p class="eyebrow" id="pageEyebrow">YOUR LIBRARY</p><h1 id="pageTitle">资料库</h1></div><button class="quiet-btn" id="quickContinue" type="button"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 9 6-9 6Z"/></svg><span>继续学习</span></button></header>
      <div id="app" aria-live="polite"></div>
    </main>
  </div>
  <dialog id="vocabDialog" aria-labelledby="vocabDialogTitle"><form method="dialog" id="vocabForm" class="modal-card">
    <div class="modal-head"><div><p class="eyebrow">VOCABULARY</p><h2 id="vocabDialogTitle">添加到生词本</h2></div><button value="cancel" class="icon-btn" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <label>Word / Phrase<input id="vocabText" required readonly></label>
    <label>English Definition<textarea id="vocabDefinition" rows="4" required placeholder="从 Longman 选择符合当前语境的英文释义，并手动粘贴到这里"></textarea></label>
    <div class="read-only"><span>Original Sentence</span><p id="vocabSentence"></p></div><div class="read-only"><span>Source</span><p id="vocabSource"></p></div>
    <button type="button" class="audio-preview" id="vocabAudio"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5ZM15 9a4 4 0 0 1 0 6M17.5 6.5a8 8 0 0 1 0 11"/></svg><span>播放 Original Sentence Audio</span></button>
    <div class="modal-actions"><button value="cancel" class="secondary-btn">取消</button><button type="button" id="saveVocab" class="primary-btn">保存</button></div>
  </form></dialog>
  <dialog id="skipDictationDialog" aria-labelledby="skipDictationTitle">
    <form method="dialog" class="modal-card confirm-card">
      <div><p class="eyebrow">FIRST DICTATION</p><h2 id="skipDictationTitle">还没有完成第一次听写</h2></div>
      <p>现在查看英文吗？直接查看将跳过本句听写，不生成听写差异。</p>
      <div class="modal-actions"><button value="continue" class="secondary-btn">继续听写</button><button value="skip" class="primary-btn">直接查看英文</button></div>
    </form>
  </dialog>
  <dialog id="transferDialog" aria-labelledby="transferDialogTitle">
    <div class="modal-card transfer-card">
      <div class="modal-head"><div><p class="eyebrow">KEYWORD TRANSFER</p><h2 id="transferDialogTitle">关键词迁移回忆</h2></div><button class="icon-btn close-transfer" type="button" aria-label="关闭"><svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <p class="transfer-instruction">原文已隐藏。只根据关键词，尽量重新写出完整句子。</p>
      <div id="transferCues" class="transfer-cues" aria-label="关键词线索"></div>
      <label for="transferInput">重新生成英文句子<textarea id="transferInput" rows="5" required spellcheck="false" autocomplete="off" placeholder="只看关键词，从记忆中写出整句……"></textarea></label>
      <div id="transferResult" class="transfer-result" role="status" aria-live="polite" hidden></div>
      <div class="modal-actions"><button class="secondary-btn close-transfer" type="button">稍后再练</button><button class="primary-btn" id="submitTransfer" type="button">完成迁移练习</button></div>
    </div>
  </dialog>
  <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="关闭菜单" hidden></button>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="learning-engine.js?v=1.3.0" defer></script>
  <script src="mvp.js?v=1.7.0" defer></script>
</body></html>
